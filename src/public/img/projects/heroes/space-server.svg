<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="space-server — Self-hosted personal infrastructure — 42 containerized services on a Hetzner VPS, behind Traefik, with full mail server">
  <style>
    .mono  { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; }
    .stamp { font-family: 'Saira Extra Condensed',Impact,'Arial Narrow',sans-serif; }
    .title { font-family: 'Noto Serif Display','Times New Roman',serif; }
    .kanji { font-family: 'Shippori Mincho B1',YuMincho,serif; }
  </style>

  <rect width="1200" height="480" fill="#000000"/>
  <rect width="1200" height="46" fill="#0a0a0a"/>
  <rect y="46" width="1200" height="1" fill="rgba(255,255,255,0.12)"/>
  <text class="stamp" x="56" y="30" font-size="15" fill="#6699ff" letter-spacing="2.2">CASE-0010 · SPACE-SERVER</text>
  <text class="kanji" x="1144" y="30" font-size="15" fill="#5a5a5a" text-anchor="end">自主運用</text>

  <g transform="translate(56,176) scale(0.82,1)">
    <text class="title" x="0" y="0" font-size="76" fill="#ffffff">space-server</text>
  </g>

  <text class="mono" x="56" y="228" font-size="22" fill="#aaaaaa">Self-hosted personal infrastructure — 42 containerized services on a</text>
  <text class="mono" x="56" y="258" font-size="22" fill="#aaaaaa">Hetzner VPS, behind Traefik, with full mail server.</text>
  <text class="mono" x="56" y="294" font-size="14" fill="#5a5a5a">Traefik edge · mail · observability · alerting</text>

  <rect x="56" y="292" width="1088" height="1" fill="rgba(255,255,255,0.06)"/>
  <text class="stamp" x="56" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">CONTAINERS</text>
  <text class="mono" x="56" y="360" font-size="25" fill="#7aed7a">42</text>
  <text class="stamp" x="194" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">SUBDOMAINS</text>
  <text class="mono" x="194" y="360" font-size="25" fill="#7aed7a">21</text>
  <text class="stamp" x="332" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">HOSTS</text>
  <text class="mono" x="332" y="360" font-size="25" fill="#7aed7a">1</text>

  <rect x="56" y="404" width="70" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="91" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Docker</text>
  <rect x="134" y="404" width="134" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="201" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Docker Compose</text>
  <rect x="276" y="404" width="118" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="335" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Traefik v3.6</text>
  <rect x="402" y="404" width="158" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="481" y="424" font-size="12" fill="#66ddff" text-anchor="middle">docker-mailserver</text>
  <rect x="568" y="404" width="78" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="607" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Ghost 5</text>

  <text class="mono" x="1144" y="424" font-size="12" fill="#66ddff" text-anchor="end">github.com/cativo23/space-server</text>
