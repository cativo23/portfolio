  <text class="mono" x="205" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Node.js</text>
  <rect x="252" y="404" width="46" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="275" y="424" font-size="12" fill="#66ddff" text-anchor="middle">npm</text>
  <rect x="306" y="404" width="46" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="329" y="424" font-size="12" fill="#66ddff" text-anchor="middle">CLI</text>
  <rect x="360" y="404" width="102" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="411" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Statusline</text>

