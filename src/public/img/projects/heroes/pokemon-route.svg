<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="pokemon-route — a route for playing the whole Pokemon series, one story per region">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>

  <g opacity="0.06" stroke="#9ece6a" stroke-width="1">
    <line x1="0"   y1="120" x2="1200" y2="120"/>
    <line x1="0"   y1="360" x2="1200" y2="360"/>
    <line x1="60"  y1="0"   x2="60"   y2="480"/>
    <line x1="1140" y1="0"  x2="1140" y2="480"/>
  </g>

  <text class="mono" x="60" y="80" font-size="14" fill="#7aa2f7" opacity="0.65">cativo23@github:~$ python3 tools/validate.py  &#8594;  33 checks, 0 failed</text>

  <g class="mono" font-size="20" fill="#9ece6a" filter="url(#softGlow)" font-weight="600">
    <text x="60" y="150" xml:space="preserve">                 __                                                     __     </text>
    <text x="60" y="173" xml:space="preserve">    ____  ____  / /_____  ____ ___  ____  ____        _________  __  __/ /____ </text>
    <text x="60" y="196" xml:space="preserve">   / __ \/ __ \/ //_/ _ \/ __ `__ \/ __ \/ __ \______/ ___/ __ \/ / / / __/ _ \</text>
    <text x="60" y="219" xml:space="preserve">  / /_/ / /_/ / ,&lt; /  __/ / / / / / /_/ / / / /_____/ /  / /_/ / /_/ / /_/  __/</text>
    <text x="60" y="242" xml:space="preserve"> / .___/\____/_/|_|\___/_/ /_/ /_/\____/_/ /_/     /_/   \____/\__,_/\__/\___/ </text>
    <text x="60" y="265" xml:space="preserve">/_/                                                                            </text>
  </g>

  <!-- Doce paradas, una por region: el brillo sube con la generacion de hardware. -->
    <rect x="60" y="295" width="78" height="6" fill="#9ece6a" opacity="0.22"/>
    <rect x="144" y="295" width="78" height="6" fill="#9ece6a" opacity="0.29"/>
    <rect x="228" y="295" width="78" height="6" fill="#9ece6a" opacity="0.36"/>
    <rect x="312" y="295" width="78" height="6" fill="#9ece6a" opacity="0.43"/>
    <rect x="396" y="295" width="78" height="6" fill="#9ece6a" opacity="0.50"/>
    <rect x="480" y="295" width="78" height="6" fill="#9ece6a" opacity="0.57"/>
    <rect x="564" y="295" width="78" height="6" fill="#9ece6a" opacity="0.65"/>
    <rect x="648" y="295" width="78" height="6" fill="#9ece6a" opacity="0.72"/>
    <rect x="732" y="295" width="78" height="6" fill="#9ece6a" opacity="0.79"/>
    <rect x="816" y="295" width="78" height="6" fill="#9ece6a" opacity="0.86"/>
    <rect x="900" y="295" width="78" height="6" fill="#9ece6a" opacity="0.93"/>
    <rect x="984" y="295" width="78" height="6" fill="#9ece6a" opacity="1.00"/>

  <text class="sans" x="60" y="345" font-size="26" fill="#c0caf5" font-weight="500">The whole Pok&#233;mon series, one story per region</text>
  <text class="sans" x="60" y="374" font-size="15" fill="#a9b1d6" opacity="0.85">12 games &#183; no version played twice &#183; no build step &#183; no dependencies</text>

  <g class="mono" font-size="13">
      <g transform="translate(60,404)">
        <rect width="66" height="32" rx="6" ry="6" fill="#1f2335" stroke="#f7768e" stroke-opacity="0.45"/>
        <text x="33" y="21" fill="#f7768e" text-anchor="middle">HTML</text>
      </g>
      <g transform="translate(136,404)">
        <rect width="57" height="32" rx="6" ry="6" fill="#1f2335" stroke="#7aa2f7" stroke-opacity="0.45"/>
        <text x="28" y="21" fill="#7aa2f7" text-anchor="middle">CSS</text>
      </g>
      <g transform="translate(203,404)">
        <rect width="120" height="32" rx="6" ry="6" fill="#1f2335" stroke="#e0af68" stroke-opacity="0.45"/>
        <text x="60" y="21" fill="#e0af68" text-anchor="middle">Vanilla JS</text>
      </g>
      <g transform="translate(333,404)">
        <rect width="84" height="32" rx="6" ry="6" fill="#1f2335" stroke="#9ece6a" stroke-opacity="0.45"/>
        <text x="42" y="21" fill="#9ece6a" text-anchor="middle">0 deps</text>
      </g>
  </g>

  <text class="mono" x="1140" y="430" font-size="12" fill="#565f89" text-anchor="end" opacity="0.7">live at pokemon.cativo.dev</text>
</svg>
