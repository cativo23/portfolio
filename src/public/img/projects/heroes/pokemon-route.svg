<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="pokemon-route — A route for playing the whole Pokemon series, Gen 1 to Gen 9 — twelve games, one story per region, zero dependencies">
  <style>
    .mono  { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; }
    .stamp { font-family: 'Saira Extra Condensed',Impact,'Arial Narrow',sans-serif; }
    .title { font-family: 'Noto Serif Display','Times New Roman',serif; }
    .kanji { font-family: 'Shippori Mincho B1',YuMincho,serif; }
  </style>

  <rect width="1200" height="480" fill="#000000"/>
  <rect width="1200" height="46" fill="#0a0a0a"/>
  <rect y="46" width="1200" height="1" fill="rgba(255,255,255,0.12)"/>
  <text class="stamp" x="56" y="30" font-size="15" fill="#6699ff" letter-spacing="2.2">CASE-0016 · POKEMON-ROUTE</text>
  <text class="kanji" x="1144" y="30" font-size="15" fill="#5a5a5a" text-anchor="end">経路記録</text>

  <g transform="translate(56,176) scale(0.82,1)">
    <text class="title" x="0" y="0" font-size="76" fill="#ffffff">pokemon-route</text>
  </g>

  <text class="mono" x="56" y="228" font-size="22" fill="#aaaaaa">A route for playing the whole Pokemon series, Gen 1 to Gen 9 — twelve</text>
  <text class="mono" x="56" y="258" font-size="22" fill="#aaaaaa">games, one story per region, zero dependencies.</text>
  <text class="mono" x="56" y="294" font-size="14" fill="#5a5a5a">twelve games · no version played twice · no build step</text>

  <rect x="56" y="292" width="1088" height="1" fill="rgba(255,255,255,0.06)"/>
  <text class="stamp" x="56" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">STOPS</text>
  <text class="mono" x="56" y="360" font-size="25" fill="#7aed7a">12</text>
  <text class="stamp" x="154" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">WEIGHT</text>
  <text class="mono" x="154" y="360" font-size="25" fill="#7aed7a">196KB</text>
  <text class="stamp" x="292" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">DEPS</text>
  <text class="mono" x="292" y="360" font-size="25" fill="#7aed7a">0</text>
  <text class="stamp" x="382" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">CI CHECKS</text>
  <text class="mono" x="382" y="360" font-size="25" fill="#7aed7a">33</text>

  <rect x="56" y="404" width="54" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="83" y="424" font-size="12" fill="#66ddff" text-anchor="middle">HTML</text>
  <rect x="118" y="404" width="46" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="141" y="424" font-size="12" fill="#66ddff" text-anchor="middle">CSS</text>
  <rect x="172" y="404" width="102" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="223" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Vanilla JS</text>
  <rect x="282" y="404" width="70" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="317" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Python</text>
  <rect x="360" y="404" width="62" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="391" y="424" font-size="12" fill="#66ddff" text-anchor="middle">nginx</text>

  <text class="mono" x="1144" y="424" font-size="12" fill="#66ddff" text-anchor="end">pokemon.cativo.dev</text>
