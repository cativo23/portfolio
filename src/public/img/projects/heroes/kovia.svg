<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="kovia — Smart pet adoption platform with an automated 0–100 scoring engine, multi-tenant org access, and Google OAuth">
  <style>
    .mono  { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; }
    .stamp { font-family: 'Saira Extra Condensed',Impact,'Arial Narrow',sans-serif; }
    .title { font-family: 'Noto Serif Display','Times New Roman',serif; }
    .kanji { font-family: 'Shippori Mincho B1',YuMincho,serif; }
  </style>

  <rect width="1200" height="480" fill="#000000"/>
  <rect width="1200" height="46" fill="#0a0a0a"/>
  <rect y="46" width="1200" height="1" fill="rgba(255,255,255,0.12)"/>
  <text class="stamp" x="56" y="30" font-size="15" fill="#6699ff" letter-spacing="2.2">CASE-0007 · KOVIA</text>
  <text class="kanji" x="1144" y="30" font-size="15" fill="#5a5a5a" text-anchor="end">里親制度</text>

  <g transform="translate(56,176) scale(0.82,1)">
    <text class="title" x="0" y="0" font-size="76" fill="#ffffff">kovia</text>
  </g>

  <text class="mono" x="56" y="228" font-size="22" fill="#aaaaaa">Smart pet adoption platform with an automated 0–100 scoring engine,</text>
  <text class="mono" x="56" y="258" font-size="22" fill="#aaaaaa">multi-tenant org access, and Google OAuth.</text>
  <text class="mono" x="56" y="294" font-size="14" fill="#5a5a5a">row-level multi-tenancy · rule-based applicant scoring</text>

  <rect x="56" y="292" width="1088" height="1" fill="rgba(255,255,255,0.06)"/>
  <text class="stamp" x="56" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">TESTS</text>
  <text class="mono" x="56" y="360" font-size="25" fill="#7aed7a">356</text>
  <text class="stamp" x="162" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">REGRESSION BUGS</text>
  <text class="mono" x="162" y="360" font-size="25" fill="#7aed7a">2</text>

  <rect x="56" y="404" width="94" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="103" y="424" font-size="12" fill="#66ddff" text-anchor="middle">NestJS 11</text>
  <rect x="158" y="404" width="70" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="193" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Nuxt 4</text>
  <rect x="236" y="404" width="102" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="287" y="424" font-size="12" fill="#66ddff" text-anchor="middle">TypeScript</text>
  <rect x="346" y="404" width="86" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="389" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Prisma 7</text>
  <rect x="440" y="404" width="126" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="503" y="424" font-size="12" fill="#66ddff" text-anchor="middle">PostgreSQL 16</text>

  <text class="mono" x="1144" y="424" font-size="12" fill="#66ddff" text-anchor="end">github.com/cativo23/kovia</text>
