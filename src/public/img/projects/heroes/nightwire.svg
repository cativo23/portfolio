<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="nightwire — Dark-mode-only cyberpunk UI design system. Pure #000000 void, semantic neon palette, AI-first">
  <style>
    .mono  { font-family: 'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace; }
    .stamp { font-family: 'Saira Extra Condensed',Impact,'Arial Narrow',sans-serif; }
    .title { font-family: 'Noto Serif Display','Times New Roman',serif; }
    .kanji { font-family: 'Shippori Mincho B1',YuMincho,serif; }
  </style>

  <rect width="1200" height="480" fill="#000000"/>
  <rect width="1200" height="46" fill="#0a0a0a"/>
  <rect y="46" width="1200" height="1" fill="rgba(255,255,255,0.12)"/>
  <text class="stamp" x="56" y="30" font-size="15" fill="#6699ff" letter-spacing="2.2">CASE-0006 · NIGHTWIRE</text>
  <text class="kanji" x="1144" y="30" font-size="15" fill="#5a5a5a" text-anchor="end">設計体系</text>

  <g transform="translate(56,176) scale(0.82,1)">
    <text class="title" x="0" y="0" font-size="76" fill="#ffffff">nightwire</text>
  </g>

  <text class="mono" x="56" y="228" font-size="22" fill="#aaaaaa">Dark-mode-only cyberpunk UI design system. Pure #000000 void, semantic</text>
  <text class="mono" x="56" y="258" font-size="22" fill="#aaaaaa">neon palette, AI-first.</text>
  <text class="mono" x="56" y="294" font-size="14" fill="#5a5a5a">pure black surfaces · no decorative colour · agent-readable</text>

  <rect x="56" y="292" width="1088" height="1" fill="rgba(255,255,255,0.06)"/>
  <text class="stamp" x="56" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">GIT TAGS</text>
  <text class="mono" x="56" y="360" font-size="25" fill="#7aed7a">20</text>
  <text class="stamp" x="178" y="330" font-size="12" fill="#6699ff" letter-spacing="1.6">VERSION</text>
  <text class="mono" x="178" y="360" font-size="25" fill="#7aed7a">2.0.1</text>

  <rect x="56" y="404" width="46" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="79" y="424" font-size="12" fill="#66ddff" text-anchor="middle">CSS</text>
  <rect x="110" y="404" width="110" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="165" y="424" font-size="12" fill="#66ddff" text-anchor="middle">TailwindCSS</text>
  <rect x="228" y="404" width="46" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="251" y="424" font-size="12" fill="#66ddff" text-anchor="middle">npm</text>
  <rect x="282" y="404" width="126" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="345" y="424" font-size="12" fill="#66ddff" text-anchor="middle">Design System</text>
  <rect x="416" y="404" width="86" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="459" y="424" font-size="12" fill="#66ddff" text-anchor="middle">AI-first</text>

  <text class="mono" x="1144" y="424" font-size="12" fill="#66ddff" text-anchor="end">www.npmjs.com/package/@cativo23/nightwire</text>
