  <rect x="362" y="404" width="102" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text class="mono" x="413" y="424" font-size="12" fill="#66ddff" text-anchor="middle">PostgreSQL</text>
  <rect x="472" y="404" width="62" height="30" fill="none" stroke="rgba(255,255,255,0.12)"/>
